<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>የመማሪያ ረዳት | Learning Assistant</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .info-box {
      position: static !important;
      padding: 8px 12px !important;
      margin: 12px 0 !important;
      font-size: 0.85rem !important;
      line-height: 1.5 !important;
      border-radius: 8px;
    }

    .info-box p {
      margin: 2px 0 !important;
    }

    footer {
      position: static !important;
      display: block !important;
      margin: 12px 0 24px !important;
      padding: 8px 0 !important;
      text-align: center;
      font-size: 0.85rem;
    }

    body {
      padding-bottom: 24px;
    }

    .voice-status {
      min-height: 1.2em;
      margin: 6px 0;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }

    .voice-status.ok {
      color: #0a7d3b;
    }

    .voice-status.warn {
      color: #b3261e;
    }

    .voice-status.info {
      color: #1f5fbf;
    }

    body.high-contrast .voice-status {
      color: #ffff00;
    }

    .language-switch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 12px 0 18px;
    }

    .language-switch label {
      margin: 0;
      font-weight: 600;
    }

    .language-switch select {
      min-height: 48px;
      padding: 10px 14px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #0f4c81;
    }

    body.high-contrast .language-switch select {
      background: #000;
      color: #fff;
      border-color: #fff;
    }

    .font-tools button {
      width: 56px;
      min-width: 56px;
      height: 48px;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .font-tools button span {
      pointer-events: none;
    }
  </style>
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <nav class="top-nav">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
  </nav>

  <div class="container">
    <header>
      <h1>የመማሪያ ረዳት</h1>
      <p class="subtitle">
        <span class="typing">Multilingual Learning Assistant</span>
      </p>
    </header>

      <div class="language-switch">
        <label for="languageSelect">🌐 Language / ቋንቋ</label>

        <select id="languageSelect" aria-label="Choose interface language">
          <option value="en">English</option>
          <option value="am">አማርኛ</option>
          <option value="om">Afaan Oromoo</option>
          <option value="ti">ትግርኛ</option>
          <option value="ar">العربية</option>
        </select>
      </div>

      <div class="language-switch">
        <label for="voiceLanguageSelect">🔊 Read answer in / በድምፅ ያንብብ</label>

        <select id="voiceLanguageSelect" aria-label="Choose read-aloud language">
          <option value="en">English</option>
          <option value="am">አማርኛ</option>
          <option value="om">Afaan Oromoo</option>
          <option value="ti">ትግርኛ</option>
          <option value="ar">العربية</option>
        </select>
      </div>

      <div class="box">
        <label for="question" id="questionLabel">Type your question</label>

        <textarea
          id="question"
          placeholder="Ask any question..."
        ></textarea>
      </div>

      <div class="buttons voice-row">
        <button id="speakAnswerBtn" type="button" aria-pressed="false">
          🔊 Read answer
        </button>
      </div>

      <p id="voiceStatus" class="voice-status" role="status" aria-live="assertive"></p>

      <div class="buttons">
        <button id="getAnswerBtn" type="button">Get answer</button>

        <button
          id="speakAnswerBtn"
          type="button"
          aria-pressed="false"
        >
          🔊 Read answer
        </button>

        <button id="clearBtn" type="button">Clear</button>
      </div>

      <div class="suggestions">
        <button class="suggest" type="button" data-q="Accessibility Hackathon 2026">
          📘 Learning
        </button>

        <button class="suggest" type="button" data-q="Visual support">
          👁️ Visual Support
        </button>

        <button class="suggest" type="button" data-q="Hearing support">
          👂 Hearing Support
        </button>

        <button class="suggest" type="button" data-q="Mobility support">
          ♿ Mobility Support
        </button>
      </div>

      <div class="font-tools" role="group" aria-label="Text size controls">
        <button id="fontSmall" type="button" aria-label="Decrease text size">
          <span aria-hidden="true">➖</span>
        </button>

        <button id="fontNormal" type="button" aria-label="Normal text size">
          <span aria-hidden="true">A</span>
        </button>

        <button id="fontLarge" type="button" aria-label="Increase text size">
          <span aria-hidden="true">➕</span>
        </button>
      </div>

      <div class="font-tools">
        <button id="contrastBtn" type="button" aria-pressed="false">
          High contrast
        </button>
      </div>

      <div class="box">
        <label for="answer" id="answerLabel">Answer</label>

        <textarea
          id="answer"
          readonly
          placeholder="Your answer will appear here..."
        ></textarea>
      </div>

      <div class="copy-container">
        <button id="copyBtn" type="button">Copy</button>
      </div>

      <div id="liveRegion" aria-live="polite" class="sr-only"></div>
    </main>

    <div class="info-box">
      <p>
        ✅ Basic answers and their voice work offline.
        📶 New questions and the Amharic mic need internet.
      </p>

      <p>
        መሰረታዊ መልሶች እና ድምፃቸው ያለ ኢንተርኔት ይሰራሉ።
        አዲስ ጥያቄዎች እና የአማርኛ ማይክ ኢንተርኔት ያስፈልጋቸዋል።
      </p>
    </div>

    <footer>
      Accessibility Hackathon 2026 • Ethiopia
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
